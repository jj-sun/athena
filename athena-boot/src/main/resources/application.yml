spring:
  application:
    name: athena-boot
  # 环境 dev|test|prod
  profiles:
    active: dev
sa-token:
  token-name: X-Access-Token
  # 登录超时单位：秒
  timeout: 1800
  is-share: false
  is-read-cookie: false
  # 安全提示（待整改）：JWT 签名密钥明文提交在代码库中，且熵偏低。持有该密钥即可伪造任意
  # 用户的 token。应改为从环境变量/密钥管理注入，并轮换为高熵随机值。
  jwt-secret-key: sdnyjtlxkykjxxgs
  # 接口签名（防重放）配置，需与前端 VITE_REPLAY_SECRET 一致
  # 安全提示（待整改）：该密钥与前端 .env 中的 VITE_REPLAY_SECRET 相同，属于对称密钥且随
  # 前端包分发，攻击者可直接读取并伪造合法签名。防重放能力仅限于时间戳窗口（300s）+ nonce 去重，
  # 不能作为鉴权或身份边界使用。
  sign:
    secret-key: a9F3k2L8mQ1xW7zC4vB6nM0pR5tY2eU8
    digest-algo: sha256
    timestamp-disparity: 300000
athena:
  dict:
    # 允许 @Dict(dictTable=...) 动态翻译的字典表白名单（逗号分隔）。
    # 这些表名会被拼进 SysDictMapper 的 ${table}，必须显式列出，新增字典表时在此追加。
    allowed-tables: sys_dept
  rsa:
    # 安全提示（待整改）：RSA 私钥以明文提交在代码库中，等于公开。前端用它做“加密”只是
    # 混淆而非安全边界 —— 任何拿到仓库的人都能解密抓包内容。应改为从环境变量/密钥管理注入。
    private-key: ""