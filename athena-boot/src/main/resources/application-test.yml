spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://127.0.0.1:3306/athena_boot?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      username: root
      password: 123456
      initial-size: 10
      max-active: 100
      min-idle: 10
      max-wait: 60000
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      #Oracle需要打开注释
      #validation-query: SELECT 1 FROM DUAL
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      stat-view-servlet:
        # 测试环境关闭 Druid 监控台。它是 starter 注册的独立 servlet，Sa-Token 的登录拦截器
        # （Spring MVC HandlerInterceptor）看不到它，因此仅从免登录白名单移除 /druid/** 无效。
        enabled: false
      filter:
        stat:
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: false
        wall:
          # 显式关闭 Druid SQL 防火墙（此前从未生效，详见 application-prod.yml 中的说明）
          enabled: false
# 测试环境不暴露接口文档
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
knife4j:
  enable: false
logging:
  level:
    com.athena.modules.system.mapper: info